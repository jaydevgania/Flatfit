name: Build FlatFit Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Prepare Clean Android Platform
        run: |
          echo "=== 1. Backing up FlatFit custom AndroidManifest and res ==="
          mkdir -p /tmp/flatfit_backup
          if [ -f flatfit/android/app/src/main/AndroidManifest.xml ]; then
            cp flatfit/android/app/src/main/AndroidManifest.xml /tmp/flatfit_backup/AndroidManifest.xml
          fi
          if [ -d flatfit/android/app/src/main/res ]; then
            cp -r flatfit/android/app/src/main/res /tmp/flatfit_backup/res
          fi

          echo "=== 2. Generating pristine Flutter 3.24 Android scaffolding ==="
          flutter create /tmp/fresh_app --platforms=android --org=com.flatfit --project-name=flatfit
          rm -rf flatfit/android
          cp -r /tmp/fresh_app/android flatfit/android
          rm -rf /tmp/fresh_app

          echo "=== 3. Restoring FlatFit custom AndroidManifest and res ==="
          if [ -f /tmp/flatfit_backup/AndroidManifest.xml ]; then
            sed -i 's/package="com.flatfit.app"//g' /tmp/flatfit_backup/AndroidManifest.xml
            cp /tmp/flatfit_backup/AndroidManifest.xml flatfit/android/app/src/main/AndroidManifest.xml
          fi
          if [ -d /tmp/flatfit_backup/res ]; then
            cp -r /tmp/flatfit_backup/res/* flatfit/android/app/src/main/res/
          fi

          echo "=== 4. Updating minSdk to 21 and multiDex ==="
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' flatfit/android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' flatfit/android/app/build.gradle || true

      - name: Install Dependencies
        run: |
          cd flatfit
          flutter pub get

      - name: Run Unit Tests
        run: |
          cd flatfit
          flutter test
        continue-on-error: true

      - name: Build Android Release APK
        run: |
          set -e -o pipefail
          cd flatfit
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee /tmp/build_log.txt
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Dump Build Log
        if: always()
        run: |
          echo "=== TAIL OF BUILD LOG ==="
          if [ -f /tmp/build_log.txt ]; then
            tail -n 120 /tmp/build_log.txt
          fi

      - name: Push Error Log to Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ci-build-log 2>/dev/null || git checkout ci-build-log
          cp /tmp/build_log.txt ./build_error.log 2>/dev/null || echo "No log captured" > ./build_error.log
          git add ./build_error.log
          git commit -m "ci: capture build error log [skip ci]" || true
          git push -f origin ci-build-log || true

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flatfit-release-apk
          path: flatfit/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0 flatfit/build/app/outputs/flutter-apk/app-release.apk \
            --title "FlatFit v1.0.0 Release APK" \
            --notes "Official FlatFit Android Release APK (Direct Download)"
