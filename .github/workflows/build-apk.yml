name: Build FlatFit Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Platform Harness
        run: |
          cd flatfit
          rm -rf android
          flutter create . --platforms=android --org=com.flatfit --project-name=flatfit
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              c = f.read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          """
          c = c.replace("<application", perms + "\n    <application")
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(c)

          with open("android/app/build.gradle", "r") as f:
              bg = f.read()
          bg = bg.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
          bg = bg.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
          with open("android/app/build.gradle", "w") as f:
              f.write(bg)
          '

      - name: Install Dependencies
        run: |
          cd flatfit
          flutter pub get

      - name: Run Unit Tests
        run: |
          cd flatfit
          flutter test
        continue-on-error: true

      - name: Build Android Release APK
        run: |
          cd flatfit
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatfit-release-apk
          path: flatfit/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
