name: Build FlatFit Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Platform Harness
        run: |
          cd flatfit
          rm -rf android
          flutter create . --platforms=android --org=com.flatfit --project-name=flatfit
          python3 -c "f='android/app/src/main/AndroidManifest.xml'; open(f,'w').write(open(f).read().replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application'))"

      - name: Install Dependencies
        run: |
          cd flatfit
          flutter pub get

      - name: Run Unit Tests
        run: |
          cd flatfit
          flutter test
        continue-on-error: true

      - name: Build Android Release APK
        run: |
          cd flatfit
          flutter build apk --release --no-tree-shake-icons --verbose > build.log 2>&1 || (
            echo "## ❌ Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          )

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatfit-release-apk
          path: flatfit/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
