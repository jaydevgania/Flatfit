name: Build FlatFit Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Prepare Clean Android Platform
        run: |
          echo "=== 1. Backing up FlatFit AndroidManifest ==="
          cp flatfit/android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml

          echo "=== 2. Generating pristine Flutter 3.24 Android scaffolding ==="
          flutter create /tmp/fresh_app --platforms=android --org=com.flatfit --project-name=app
          rm -rf flatfit/android
          cp -r /tmp/fresh_app/android flatfit/android
          rm -rf /tmp/fresh_app

          echo "=== 3. Restoring FlatFit AndroidManifest and setting up drawables ==="
          cp /tmp/AndroidManifest.xml flatfit/android/app/src/main/AndroidManifest.xml
          mkdir -p flatfit/android/app/src/main/res/drawable
          mkdir -p flatfit/android/app/src/main/res/drawable-v21
          if [ -f flatfit/android/app/src/main/res/drawable-v21/launch_background.xml ]; then
            cp -f flatfit/android/app/src/main/res/drawable-v21/launch_background.xml flatfit/android/app/src/main/res/drawable/launch_background.xml
          fi

          echo "=== 4. Updating minSdk and multiDex in app/build.gradle ==="
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' flatfit/android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' flatfit/android/app/build.gradle || true
          sed -i '/defaultConfig {/a \        multiDexEnabled true' flatfit/android/app/build.gradle || true
          echo '' >> flatfit/android/app/build.gradle
          echo 'dependencies {' >> flatfit/android/app/build.gradle
          echo '    implementation "androidx.multidex:multidex:2.0.1"' >> flatfit/android/app/build.gradle
          echo '}' >> flatfit/android/app/build.gradle

      - name: Install Dependencies
        run: |
          cd flatfit
          flutter pub get -v 2>&1 | tee /tmp/pub_get.log
          exit ${PIPESTATUS[0]}

      - name: Print Pub Error
        if: failure()
        run: |
          echo "### Pub Get Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 /tmp/pub_get.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run Unit Tests
        run: |
          cd flatfit
          flutter test
        continue-on-error: true

      - name: Build Android Release APK
        run: |
          cd flatfit
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee /tmp/build_apk.log
          exit ${PIPESTATUS[0]}

      - name: Print Build Error
        if: failure()
        run: |
          echo "==================== BUILD APK FAILURE LOG ===================="
          cat /tmp/build_apk.log || true
          echo "================================================================"
          echo "### Build APK Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 /tmp/build_apk.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            /tmp/pub_get.log
            /tmp/build_apk.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flatfit-release-apk
          path: flatfit/build/app/outputs/**/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "FlatFit Android App v1.0.0"
          body: "Official FlatFit Android Release APK — Compatibility-first flatmate matching & co-living platform for India."
          files: flatfit/build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
