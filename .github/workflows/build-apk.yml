name: Build FlatFit Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Prepare Clean Android Platform
        run: |
          echo "=== 1. Backing up FlatFit custom AndroidManifest and res ==="
          mkdir -p /tmp/flatfit_backup
          if [ -f flatfit/android/app/src/main/AndroidManifest.xml ]; then
            cp flatfit/android/app/src/main/AndroidManifest.xml /tmp/flatfit_backup/AndroidManifest.xml
          fi
          if [ -d flatfit/android/app/src/main/res ]; then
            cp -r flatfit/android/app/src/main/res /tmp/flatfit_backup/res
          fi

          echo "=== 2. Generating pristine Flutter 3.24 Android scaffolding ==="
          flutter create /tmp/fresh_app --platforms=android --org=com.flatfit --project-name=flatfit
          rm -rf flatfit/android
          cp -r /tmp/fresh_app/android flatfit/android
          rm -rf /tmp/fresh_app

          echo "=== 3. Restoring FlatFit custom AndroidManifest and res ==="
          if [ -f /tmp/flatfit_backup/AndroidManifest.xml ]; then
            sed -i 's/package="com.flatfit.app"//g' /tmp/flatfit_backup/AndroidManifest.xml
            cp /tmp/flatfit_backup/AndroidManifest.xml flatfit/android/app/src/main/AndroidManifest.xml
          fi
          if [ -d /tmp/flatfit_backup/res ]; then
            cp -r /tmp/flatfit_backup/res/* flatfit/android/app/src/main/res/
          fi

          echo "=== 4. Updating minSdk to 21 for modern plugins ==="
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' flatfit/android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' flatfit/android/app/build.gradle || true

      - name: Install Dependencies
        run: |
          cd flatfit
          flutter pub get 2>&1 | tee /tmp/pub_get_log.txt

      - name: Run Unit Tests
        run: |
          cd flatfit
          flutter test 2>&1 | tee /tmp/test_log.txt
        continue-on-error: true

      - name: Build Android Release APK
        run: |
          cd flatfit
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee /tmp/build_log.txt

      - name: Report Build Diagnostics on Failure
        if: failure()
        run: |
          echo "### Build Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/build_log.txt ]; then
            echo "#### Build APK Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 /tmp/build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /tmp/test_log.txt ]; then
            echo "#### Unit Test Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 40 /tmp/test_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatfit-release-apk
          path: flatfit/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
